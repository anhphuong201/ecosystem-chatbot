name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 * * 1,4'  # Every Monday and Thursday at noon UTC
  workflow_dispatch:
  
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth health endpoint
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}"
